  let currentUserId = null;
  let generation = 0;
  const views = ['v3SetPassword','v3Login','v3Success'];
  function show(view, heading, description) {
    views.forEach(id => $(id).classList.toggle('v3-hidden', id !== view));
    $('v3Title').textContent = heading;
    $('v3Description').textContent = description;
    $('v3Status').textContent = '';
    $('v3Status').classList.remove('ok');
  }
  function message(text, ok = false) {
    $('v3Status').textContent = text;
    $('v3Status').classList.toggle('ok', ok);
  }
  function lock() {
    generation++;
    clearDashboard();
    $('v3AuthRoot').hidden = false;
  }
  async function rows(table, columns, owner, key = 'id') {
    const result = [];
    let cursor;
    for (;;) {
      let query = client.from(table).select(columns).eq('user_id',owner).order(key).limit(500);
      if (cursor) query = query.gt(key,cursor);
      const {data,error} = await query;
      if (error) throw error;
      if (!data.length) return result;
      result.push(...data);
      cursor = data[data.length-1][key];
    }
  }
  async function readCategories(owner) {
    const columns='id,kind,name,parent_id,sort_order,archived';
    const load=()=>rows('finance_categories',columns,owner);
    const current=await load();
    if (current.length) return current;
    const defaults=await defaultCategoryRows(owner);
    const {error}=await client.from('finance_categories').upsert(defaults,{onConflict:'id',ignoreDuplicates:true});
    if (error) throw error;
    return load();
  }
  async function signedIn(email, owner) {
    const sameAccount = owner === currentUserId;
    const previousView = sameAccount ? {tab,month,filter} : null;
    lock();
    currentUserId = owner;
    const request = generation;
    show('v3Success','Caricamento','Lettura dei tuoi dati da Supabase…');
    $('v3UserEmail').textContent = email;
    try {
      const [tx, assets, settings, catalog, imports] = await Promise.all([
        rows('finance_transactions','id,legacy_id,account_label,updated_at,transaction_date,kind,amount_cents,description,finance_allocations(category_id,amount_cents,category_name_snapshot,subcategory_name_snapshot)',owner),
        rows('finance_assets','id,legacy_id,updated_at,name,kind,value_cents',owner),
        rows('finance_settings','user_id,monthly_budget_cents,theme,updated_at',owner,'user_id'),
        readCategories(owner),
        client.from('finance_imports').select('id').eq('user_id',owner).order('created_at',{ascending:false}).limit(1)
      ]);
      if (generation !== request) return;
      if (imports.error) throw imports.error;
      const transactions = tx.map(t => {
        const splits = t.finance_allocations.map(a => ({category_id:a.category_id,category:a.category_name_snapshot || 'Altro',
          subcategory:a.subcategory_name_snapshot || '', amount:a.amount_cents/100}));
        if (t.finance_allocations.reduce((n,a)=>n+a.amount_cents,0)!==t.amount_cents)
          throw new Error('Le quote ricevute non coincidono con il totale del movimento.');
        return {id:t.id,legacy_id:t.legacy_id,account:t.account_label,version:t.updated_at,type:t.kind,date:t.transaction_date,amount:t.amount_cents/100,
          note:t.description,category:splits[0]?.category,subcategory:splits[0]?.subcategory,splits};
      });
      state = {transactions, assets:assets.map(a=>({...a,value:a.value_cents/100})),
        owner,catalog,latestImport:imports.data[0]?.id,settings:settings[0], budget:(settings[0]?.monthly_budget_cents || 0)/100};
      if (previousView) ({tab,month,filter} = previousView);
      render();
      $('workspace').hidden = false;
      $('v3AuthRoot').hidden = true;
    } catch (error) {
      if (generation !== request) return;
      clearDashboard();
      show('v3Success','Dati non disponibili','Puoi riprovare la lettura o uscire dall’account.');
      message(error.message);
    }
  }
  function signedOut() {
    lock();
    currentUserId = null;
    $('v3UserEmail').textContent = '';
    show('v3Login','Bentornato','Accedi con il tuo account Finanze.');
  }
  async function persist(change) {
    const owner = currentUserId;
    const request = generation;
    const {data:identity,error:authError} = await client.auth.getUser();
    if (authError || !owner || identity?.user?.id !== owner || request !== generation)
      throw Error('Sessione cambiata. Riapri la schermata.');
    const {data,error} = await change(client,owner);
    if (error) throw error;
    if (!data) throw Error('Dato già modificato o eliminato. Aggiorna dal cloud.');
    if (request !== generation) throw Error('Sessione cambiata.');
  }
  window.financeWrite = persist;
  async function init(key) {
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      signedOut();
      message('Impossibile caricare la libreria Supabase. Verifica la connessione Internet e ricarica la pagina.');
      return;
    }
    client = window.supabase.createClient(SUPABASE_URL, key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'finanze_v3_test_auth_session' }
    });
    client.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') { setPassword = false; signedOut(); }
      if (event === 'PASSWORD_RECOVERY') {
        setPassword = true;
        lock();
        show('v3SetPassword','Scegli la tua password','Usa almeno otto caratteri.');
      }
      if (event === 'SIGNED_IN' && currentUserId && currentUserId !== session?.user?.id) location.reload();
    });
    initialized = true;
    signedOut();
    message('Verifica della sessione in corso…');
    try {
      const { data, error } = await client.auth.getUser();
      if (error && error.name !== 'AuthSessionMissingError') throw error;
      if (data?.user && setPassword) show('v3SetPassword','Scegli la tua password','Usa almeno otto caratteri.');
      else if (data?.user) signedIn(data.user.email, data.user.id);
      else signedOut();
    } catch (err) {
      signedOut();
      message('Controllo sessione non riuscito: ' + (err.message || 'Errore di rete'));
    }
  }
  $('choosePassword').onsubmit = async event => {
    event.preventDefault();
    const btn = event.target.querySelector('button');
    btn.disabled = true;
    try {
      const {data,error} = await client.auth.updateUser({password:$('newPassword').value});
      if (error) throw error;
      $('newPassword').value = '';
      setPassword = false;
      await signedIn(data.user.email,data.user.id);
    } catch (error) { message(error.message); }
    finally { btn.disabled = false; }
  };
  $('forgotPassword').onclick = async () => {
    const email = $('v3Email');
    if (!email.reportValidity()) return;
    const btn = $('forgotPassword');
    btn.disabled = true;
    try {
      const {error} = await client.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:new URL('./',location.href).href});
      if (error) throw error;
      message('Se l’indirizzo è registrato, riceverai un’email per scegliere una nuova password.',true);
    } catch (error) { message(error.message); }
    finally { btn.disabled = false; }
  };
  $('v3LoginForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!client || !initialized) return;
    const btn = $('v3LoginBtn');
    btn.disabled = true;
    message('Accesso in corso…', true);
    try {
      const email = $('v3Email').value.trim();
      const password = $('v3Password').value;
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      $('v3Password').value = '';
      if (error) throw error;
      if (!data?.user) throw new Error('Nessun utente restituito dal server.');
      signedIn(data.user.email, data.user.id);
    } catch (err) {
      $('v3Password').value = '';
      message('Accesso non riuscito: ' + (err.message || 'Errore di rete'));
    } finally { btn.disabled = false; }
  });
  $('reloadCloud').onclick = () => currentUserId && signedIn($('v3UserEmail').textContent,currentUserId);
  window.refreshAfterSave = async () => {
    const owner=currentUserId;
    await signedIn($('v3UserEmail').textContent,owner);
    if (state?.owner===owner) $('savedStatus').textContent='Modifica salvata nel cloud.';
  };
  document.addEventListener('visibilitychange',()=>{
    if (document.visibilityState==='visible' && state && !saving && tab!=='settings' && !document.querySelector('dialog[open]'))
      signedIn($('v3UserEmail').textContent,currentUserId);
  });
  $('v3LogoutBtn').addEventListener('click', async () => {
    if (!client) return;
    lock();
    $('v3LogoutBtn').disabled = true;
    message('Uscita in corso…', true);
    try {
      const { error } = await client.auth.signOut();
      if (error) throw error;
      signedOut();
      message('Sei uscito correttamente.', true);
    } catch (err) { message('Impossibile uscire: ' + (err.message || 'Errore di rete')); }
    finally { $('v3LogoutBtn').disabled = false; }
  });
  init(PUBLIC_KEY);
  // Aggiorna il service worker già presente nella sola sottocartella /finanze-v3/.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' }).catch(() => {}));
  }
})();
</script>

</body></html>
